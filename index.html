    <script>
      (function () {
        // Prevent benign Vite HMR WebSocket errors in Cloud Run proxy environment
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
            if (protoStr.indexOf('vite-hmr') !== -1 || protoStr.indexOf('vite-ping') !== -1) {
              var dummy = Object.create(EventTarget.prototype);
              dummy.readyState = 3;
              dummy.send = function () {};
              dummy.close = function () {};
              dummy.addEventListener = function () {};
              dummy.removeEventListener = function () {};
              return dummy;
            }
            return protocols !== undefined
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          PatchedWebSocket.prototype = OrigWebSocket.prototype;
          PatchedWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = OrigWebSocket.OPEN;
          PatchedWebSocket.CLOSING = OrigWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }

        window.addEventListener('unhandledrejection', function (event) {
          var msg = event && event.reason && (event.reason.message || String(event.reason));
          if (msg && (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1)) {
            event.preventDefault();
          }
        });
      })();
    </script>
